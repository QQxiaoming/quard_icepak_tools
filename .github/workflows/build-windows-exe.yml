name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: Build EXE
        run: pyinstaller quard_icepak_tools.spec --noconfirm --clean

      - name: Smoke-test EXE startup
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\quard_icepak_tools.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "EXE crashed on startup (exit code: $($proc.ExitCode))"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Write-Output "Smoke test passed: EXE started successfully"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: quard_icepak_tools-windows
          path: dist/quard_icepak_tools.exe
          if-no-files-found: error
