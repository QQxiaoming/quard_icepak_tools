name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: Compute build version
        id: version
        shell: pwsh
        run: |
          $tag = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME.Trim()
          }

          $shortHash = (git rev-parse --short HEAD).Trim()
          $version = if ($tag) { "$tag-$shortHash" } else { $shortHash }
          $safeVersion = $version -replace '[^0-9A-Za-z._-]', '-'
          $exeName = "quard_icepak_tools-$safeVersion"

          "QUARD_ICEPAK_TOOLS_VERSION=$version" >> $env:GITHUB_ENV
          "QUARD_ICEPAK_TOOLS_EXE_NAME=$exeName" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "safe_version=$safeVersion" >> $env:GITHUB_OUTPUT
          "exe_name=$exeName" >> $env:GITHUB_OUTPUT

          Set-Content -Path "build_version.py" -Encoding UTF8 -Value ("BUILD_VERSION = `"{0}`"" -f $version)

      - name: Build EXE
        run: |
          pyinstaller quard_icepak_tools.spec --noconfirm --clean
          cp "dist\${{ steps.version.outputs.exe_name }}.exe" "dist\quard_icepak_tools.exe" 

      - name: Smoke-test EXE startup
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\quard_icepak_tools.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "EXE crashed on startup (exit code: $($proc.ExitCode))"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Write-Output "Smoke test passed: EXE started successfully"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: quard_icepak_tools_windows
          path: dist/quard_icepak_tools.exe
          if-no-files-found: error
